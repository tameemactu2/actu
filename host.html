<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل دخول الهوست · نادي العلوم الاكتوارية</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#00292E" />
  <link rel="icon" type="image/png" href="assets/logo-badge-dark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="preloader">
    <img class="preloader-logo" src="assets/logo.png" alt="نادي العلوم الاكتوارية" />
  </div>
  <script>
    (function () {
      try { history.scrollRestoration = 'manual'; } catch (e) {}
      document.documentElement.style.overflow = 'hidden';
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        window.scrollTo(0, 0);
        document.documentElement.style.overflow = '';
        var p = document.getElementById('preloader');
        if (p) p.classList.add('done');
      }
      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
        requestAnimationFrame(function () { setTimeout(hide, 200); });
      });
      setTimeout(hide, 2000);
    })();
  </script>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="شعار نادي العلوم الاكتوارية" />
        <span class="brand-name">
          نادي العلوم الاكتوارية
          <span class="brand-sub en">Actuarial Science Club · KSU</span>
        </span>
      </a>
      <div class="nav-links">
        <a href="index.html">الصفحة الرئيسية</a>
      </div>
    </div>
  </nav>

  <!-- ===== شاشة تسجيل الدخول ===== -->
  <div id="login-view" class="auth-wrap">
    <div class="auth-card">
      <img class="logo" src="assets/logo-badge-dark.png" alt="" />
      <h1>تسجيل دخول الهوست</h1>
      <p class="sub">لمشرفي ومنظمي النادي فقط</p>
      <div id="login-alert" class="alert alert-error"></div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" autocomplete="username" placeholder="host@example.com" />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button id="login-btn" class="btn btn-green" style="width:100%;">دخول</button>
    </div>
  </div>

  <!-- ===== لوحة التحكم ===== -->
  <div id="admin-view" class="hidden">
    <div class="admin-bar">
      <div class="container">
        <div>لوحة تحكم الهوست</div>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="who" id="who"></span>
          <button id="logout-btn" class="btn btn-outline-mint btn-sm">تسجيل الخروج</button>
        </div>
      </div>
    </div>

    <div class="admin-section container">
      <div id="admin-alert" class="alert"></div>

      <div class="admin-tabs">
        <button class="filter-btn active" data-tab="events-tab">الفعاليات</button>
        <button class="filter-btn" data-tab="articles-tab">المقالات</button>
      </div>

      <!-- ===== تبويب الفعاليات ===== -->
      <div id="events-tab">
        <div class="admin-panel">
          <h3 id="event-form-title">إضافة فعالية جديدة</h3>
          <input type="hidden" id="event-id" />
          <div class="form-row">
            <div class="field">
              <label for="ev-title">عنوان الفعالية</label>
              <input type="text" id="ev-title" placeholder="مثال: ورشة تحضير Exam FM" />
            </div>
            <div class="field">
              <label for="ev-date">التاريخ</label>
              <input type="date" id="ev-date" class="num" />
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="ev-location">الموقع</label>
              <input type="text" id="ev-location" placeholder="مثال: كلية العلوم · قاعة 2ب45" />
            </div>
            <div class="field">
              <label for="ev-status">الحالة</label>
              <select id="ev-status">
                <option value="upcoming">قادمة</option>
                <option value="past">منتهية</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>وصف الفعالية (تقدر تنسّق وتدرج صور داخل النص)</label>
            <div id="ev-editor" class="rich-editor"></div>
          </div>
          <div class="field">
            <label>صور الفعالية (اختياري — تقدر تختار أكثر من صورة)</label>
            <label class="upload-box" for="ev-image">
              اضغط لاختيار صورة أو أكثر من جهازك (JPG / PNG / WebP)
              <input type="file" id="ev-image" accept="image/*" multiple class="hidden" />
            </label>
            <div class="upload-preview" id="ev-image-preview"></div>
          </div>
          <div class="form-actions">
            <button id="ev-save" class="btn btn-green">حفظ الفعالية</button>
            <button id="ev-preview" class="btn btn-outline-teal">معاينة</button>
            <button id="ev-cancel" class="btn btn-ghost hidden">إلغاء التعديل</button>
          </div>
        </div>

        <div class="admin-panel">
          <h3>الفعاليات الحالية</h3>
          <div id="admin-events-list" class="admin-list">
            <div class="loader">جارٍ التحميل…</div>
          </div>
        </div>
      </div>

      <!-- ===== تبويب المقالات ===== -->
      <div id="articles-tab" class="hidden">
        <div class="admin-panel">
          <h3 id="article-form-title">إضافة مقال جديد</h3>
          <input type="hidden" id="article-id" />
          <div class="field">
            <label for="ar-title">عنوان المقال</label>
            <input type="text" id="ar-title" placeholder="مثال: وش يعني اكتواري؟" />
          </div>
          <div class="field">
            <label>محتوى المقال (تقدر تنسّق وتدرج صور داخل النص)</label>
            <div id="ar-editor" class="rich-editor"></div>
          </div>
          <div class="field">
            <label>صور المقال (اختياري — تقدر تختار أكثر من صورة)</label>
            <label class="upload-box" for="ar-image">
              اضغط لاختيار صورة أو أكثر من جهازك (JPG / PNG / WebP)
              <input type="file" id="ar-image" accept="image/*" multiple class="hidden" />
            </label>
            <div class="upload-preview" id="ar-image-preview"></div>
          </div>
          <div class="form-actions">
            <button id="ar-save" class="btn btn-green">نشر المقال</button>
            <button id="ar-preview" class="btn btn-outline-teal">معاينة</button>
            <button id="ar-cancel" class="btn btn-ghost hidden">إلغاء التعديل</button>
          </div>
        </div>

        <div class="admin-panel">
          <h3>المقالات المنشورة</h3>
          <div id="admin-articles-list" class="admin-list">
            <div class="loader">جارٍ التحميل…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة المعاينة -->
  <div id="preview-modal" class="preview-modal hidden">
    <div class="preview-backdrop" id="preview-close-bg"></div>
    <div class="preview-dialog">
      <div class="preview-bar">
        <span>معاينة قبل النشر</span>
        <button class="preview-x" id="preview-close" aria-label="إغلاق">×</button>
      </div>
      <div class="preview-body detail" id="preview-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script src="js/config.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
