<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="page-title">مقال · نادي العلوم الاكتوارية</title>
  <meta name="theme-color" content="#00292E" />
  <link rel="icon" type="image/png" href="assets/logo-badge-dark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="preloader">
    <img class="preloader-logo" src="assets/logo.png" alt="نادي العلوم الاكتوارية" />
  </div>
  <script>
    (function () {
      try { history.scrollRestoration = 'manual'; } catch (e) {}
      document.documentElement.style.overflow = 'hidden';
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        window.scrollTo(0, 0);
        document.documentElement.style.overflow = '';
        var p = document.getElementById('preloader');
        if (p) p.classList.add('done');
      }
      window.addEventListener('load', function () {
        window.scrollTo(0, 0);
        requestAnimationFrame(function () { setTimeout(hide, 200); });
      });
      setTimeout(hide, 2000);
    })();
  </script>

  <nav class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.png" alt="شعار نادي العلوم الاكتوارية" />
        <span class="brand-name">
          نادي العلوم الاكتوارية
          <span class="brand-sub en">Actuarial Science Club · KSU</span>
        </span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="القائمة" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="index.html">الصفحة الرئيسية</a>
        <a href="index.html#events">الفعاليات</a>
        <a href="index.html#articles">المقالات</a>
        <a href="index.html#about">من نحن</a>
      </div>
    </div>
  </nav>
  <div class="nav-backdrop" id="nav-backdrop"></div>

  <main class="detail">
    <div class="container" id="content">
      <div class="detail-loading">جارٍ تحميل المقال…</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="assets/logo.png" alt="" />
          <div>
            <strong>نادي العلوم الاكتوارية</strong>
            <span>جامعة الملك سعود · الرياض</span>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        نادي العلوم الاكتوارية · جامعة الملك سعود — جميع الحقوق محفوظة © <span class="num">2026</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/menu.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const el = document.getElementById('content');

      if (!id) {
        el.innerHTML = `<div class="detail-loading">ما تم تحديد المقال. <a class="detail-back" href="index.html#articles">العودة للمقالات</a></div>`;
        return;
      }

      const { data, error } = await sb.from('articles').select('*').eq('id', id).single();

      if (error || !data) {
        el.innerHTML = `<div class="detail-loading">تعذّر العثور على المقال. <a class="detail-back" href="index.html#articles">العودة للمقالات</a></div>`;
        if (error) console.error(error);
        return;
      }

      document.getElementById('page-title').textContent = data.title + ' · نادي العلوم الاكتوارية';
      const dateStr = data.published_at ? formatDateAr(String(data.published_at).slice(0, 10)) : '';
      const images = (data.images && data.images.length) ? data.images : (data.image_url ? [data.image_url] : []);

      el.innerHTML = `
        <a class="detail-back" href="index.html#articles">→ العودة للمقالات</a>
        ${galleryHtml(images)}
        <h1>${escapeHtml(data.title)}</h1>
        ${dateStr ? `<div class="detail-sub"><span class="num">📅 ${dateStr}</span></div>` : ''}
        <div class="detail-content rich-content">${data.content || ''}</div>
      `;
      initGallery(images.length);
    })();
  </script>
</body>
</html>
